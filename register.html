<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - Human Library</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>

<header class="navbar">
  <div class="logo">
    <a href="index.html">📖 Human Library</a>
  </div>
</header>

<section class="auth-hero">

  <div class="auth-card">

    <h1>Create Account</h1>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button class="primary" onclick="register()">Register</button>

    <p>
      Already have an account?
      <a href="login.html">Login</a>
    </p>

  </div>

</section>

<script>
async function register() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  const res = await fetch("http://localhost:3000/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  });

  const data = await res.json();

  alert(data.message);

  if (data.success) {
    window.location.href = "login.html";
  }
}
</script>

</body>
</html>
